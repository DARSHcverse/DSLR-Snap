<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DSLR Snap</title>
  </head>
  <body>
    <!-- Startup splash: plain HTML so the logo paints before React loads; main.tsx fades it out. -->
    <div id="splash">
      <img src="/logo-wordmark.png" alt="DSLR Snap" />
      <p>Photo Booth Software for Windows</p>
    </div>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(120% 80% at 50% 0%, #241a2a 0%, #0b0b0f 60%);
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity 0.5s ease;
      }
      #splash img { width: min(520px, 70vw); height: auto; animation: splash-in 0.7s ease-out both; }
      #splash p { margin: 0; color: #9a98a3; letter-spacing: 0.2em; text-transform: uppercase; font-size: 13px; font-weight: 600; animation: splash-in 0.7s 0.25s ease-out both; }
      #splash.hide { opacity: 0; pointer-events: none; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
    </style>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
