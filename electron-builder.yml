appId: com.dslrsnap.app
productName: DSLR Snap
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  # The AI runtime ships builds for every platform; the Windows installer needs only win32/x64.
  - "!node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**"
  - "!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**"
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/better-sqlite3/**
  - node_modules/onnxruntime-node/**
extraResources:
  # AI cut-out model (npm run fetch-models) and its licence notice.
  - from: resources/models
    to: models
    filter: ["*.onnx"]
  - from: resources/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  # The compiled Canon bridge (see native/CanonBridge/README.md). Optional: app falls back to mock camera if missing.
  - from: native/CanonBridge/publish
    to: canon-bridge
    filter: ["**/*"]
# Harden the packaged app: no running it as plain Node, no debugger flags, and only the signed-off
# app.asar is loaded (edits to it are detected at start-up).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
# Browser sign-in returns to the app through dslrsnap:// links.
protocols:
  - name: DSLR Snap
    schemes: [dslrsnap]
win:
  target: [{ target: nsis, arch: [x64] }]
  # Authenticode signing: set CSC_LINK / CSC_KEY_PASSWORD env vars in CI to avoid SmartScreen warnings.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
