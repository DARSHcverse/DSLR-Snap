appId: com.dslrsnap.app
productName: DSLR Snap
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  # The AI runtime ships builds for every platform; the Windows installer needs only win32/x64.
  - "!node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**"
  - "!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**"
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/better-sqlite3/**
  - node_modules/onnxruntime-node/**
extraResources:
  # AI cut-out model (npm run fetch-models) and its licence notice.
  - from: resources/models
    to: models
    filter: ["*.onnx"]
  - from: resources/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  # ffmpeg (LGPL build, npm run fetch-models): video encoding.
  - from: resources/ffmpeg/win32
    to: ffmpeg
    filter: ["**/*"]
  # The compiled Canon bridge (see native/CanonBridge/README.md). Optional: app falls back to mock camera if missing.
  - from: native/CanonBridge/publish
    to: canon-bridge
    filter: ["**/*"]
  # The Nikon bridge (native/NikonBridge, with Nikon's SDK files). Optional, like Canon's.
  - from: native/NikonBridge/publish
    to: nikon-bridge
    filter: ["**/*"]
# Harden the packaged app: no running it as plain Node, no debugger flags, and only the signed-off
# app.asar is loaded (edits to it are detected at start-up).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
# Browser sign-in returns to the app through dslrsnap:// links.
protocols:
  - name: DSLR Snap
    schemes: [dslrsnap]
win:
  target: [{ target: nsis, arch: [x64] }]
  # Made by scripts/make-icons.mjs: 16–256 px, with a simpler mark at 16–32 px for the taskbar.
  icon: resources/icon.ico
  # Authenticode signing: set CSC_LINK / CSC_KEY_PASSWORD env vars in CI to avoid SmartScreen warnings.
nsis:
  # Versioned file names: each release is a new file, so caches and half-finished downloads never mix versions.
  artifactName: DSLR-Snap-Setup-${version}.${ext}
  oneClick: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
# Updates and the website's download page read from this folder (Cloudflare R2, public, via
# downloads.dslrsnap.com). `npm run release` uploads a build there (scripts/publish-release.mjs).
publish:
  provider: generic
  url: https://downloads.dslrsnap.com/win
  channel: latest
